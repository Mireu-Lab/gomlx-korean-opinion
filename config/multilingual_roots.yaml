cache_dir: "data/multilingual_roots"
graph_file: "data/multilingual_roots/ko_hub_graph.bin"
http_timeout_sec: 120
http_retries: 3

sources:
  unihan_zip_url: "https://www.unicode.org/Public/UCD/latest/ucd/Unihan.zip"
  unihan_zip_file: "Unihan.zip"
  omw_kor_wikt_url: "https://raw.githubusercontent.com/omwn/omw-data/main/wns/wikt/wn-wikt-kor.tab"
  omw_kor_wikt_file: "wn-wikt-kor.tab"
  omw_kor_cldr_url: "https://raw.githubusercontent.com/omwn/omw-data/main/wns/cldr/wn-cldr-kor.tab"
  omw_kor_cldr_file: "wn-cldr-kor.tab"
  omw_eng_url: "https://raw.githubusercontent.com/omwn/omw-data/main/wns/eng/wn-data-eng.tab"
  omw_eng_file: "wn-data-eng.tab"
  omw_jpn_url: "https://raw.githubusercontent.com/omwn/omw-data/main/wns/jpn/wn-data-jpn.tab"
  omw_jpn_file: "wn-data-jpn.tab"
  omw_cmn_url: "https://raw.githubusercontent.com/omwn/omw-data/main/wns/cow/wn-data-cmn.tab"
  omw_cmn_file: "wn-data-cmn.tab"

limits:
  min_ko_freq: 3
  max_ko_surface_nodes: 20000
  max_hanja_per_syllable: 4
  max_neighbors_per_node: 8
  max_candidate_senses: 4
  min_edge_confidence: 0.20
  cooccur_window: 4
  min_cooccur_count: 3
  max_corpus_docs: 80000

edge_weights:
  has_candidate_sense: 1.00
  composed_of_hanja: 0.85
  aligned_en: 1.00
  aligned_ja: 0.80
  aligned_zh: 0.75
  cooccurs_ko: 0.60
  nfc_anchor: 1.10

pretrain:
  checkpoint_dir: "checkpoints/ko_hub_pretrain"
  embed_dim: 96
  out_dim: 128
  root_embed_dim: 128
  attn_dim: 64
  max_roots_per_view: 4
  batch_size: 64
  pretrain_steps: 1000
  log_every_steps: 100
  checkpoint_keep: 2
  optimizer: "adamw"
  learning_rate: 0.003
  min_learning_rate: 0.0002
  weight_decay: 0.0001
  dropout_rate: 0.15
  temperature: 0.15
  disambig_margin: 0.35
  mask_epsilon: 0.000001
  loss_weights:
    ko_en: 1.00
    ko_hanja: 0.85
    ko_jazh: 0.75
    disambig: 1.20
    distill: 1.00

